<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<!--
  딥리서치 하네스 html 템플릿 (harness/publish/build_html.py가 채운다).
  색, 모서리, 간격, 글자 크기는 harness/rules.yaml visual 값만 쓴다. 그림자·애니메이션 없음.
  보고서용 구성: 상단 내비게이션, 표지, 핵심 발견 카드, INSIGHT 박스, 상세 펼치기, 출처 목록.
-->
<style>
{{font_faces}}
:root {
  --primary: #d9266b;
  --primary-hover: #c2185b;
  --weak-bg: #fdeef4;
  --fg: #191f28;
  --body: #4e5968;
  --muted: #8b95a1;
  --surface: #f2f4f6;
  --border: #e5e8eb;
  --canvas: #ffffff;
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; scroll-padding-top: 64px; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--body);
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  font-size: 16px; line-height: 24px; letter-spacing: -0.02em;
  word-break: keep-all; overflow-wrap: anywhere;
}
a { color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

/* 상단 고정 내비게이션 (확장) */
.nav { position: sticky; top: 0; z-index: 10; background: var(--canvas); border-bottom: 1px solid var(--border); }
.nav .wrap { display: flex; align-items: center; gap: 24px; }
.nav-title { flex: none; padding: 16px 0; font-size: 14px; line-height: 21px; font-weight: 600; color: var(--fg); text-decoration: none; }
.nav-links { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0; padding: 8px 0; list-style: none; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a { display: block; padding: 6px 8px; border-radius: 6px; font-size: 14px; line-height: 21px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.nav-links a:hover { color: var(--fg); background: var(--surface); }
.nav-links a[aria-current="true"] { color: var(--primary-hover); background: var(--weak-bg); font-weight: 600; }

/* 표지 (확장: #191f28 배경, 표지만 큰 글자) */
.cover { background: var(--fg); color: var(--canvas); }
.cover .wrap { padding-top: 32px; padding-bottom: 32px; }
.cover-eyebrow { margin: 32px 0 16px; font-size: 14px; line-height: 21px; font-weight: 600; color: var(--primary); }
.cover h1 { margin: 0 0 24px; font-size: 64px; line-height: 76px; font-weight: 700; letter-spacing: -0.02em; color: var(--canvas); }
.cover-answer { margin: 0 0 16px; max-width: 760px; font-size: 22px; line-height: 33px; font-weight: 600; color: var(--canvas); }
.cover-topic { margin: 0 0 32px; max-width: 720px; font-size: 16px; line-height: 24px; color: var(--muted); }
.cover-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0; border-top: 1px solid var(--body); }
.cover-label { margin: 0 0 16px; font-size: 14px; line-height: 21px; font-weight: 600; color: var(--muted); }
.detail-list { display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; margin: 0; font-size: 14px; line-height: 21px; }
.detail-list dt { color: var(--muted); }
.detail-list dd { margin: 0; color: var(--canvas); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.tags li { padding: 4px 16px; border: 1px solid var(--body); border-radius: 16px; font-size: 14px; line-height: 21px; color: var(--border); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 0; }
.stats div { padding: 16px 0; border-top: 1px solid var(--body); }
.stats dt { font-size: 14px; line-height: 21px; color: var(--muted); }
.stats dd { margin: 4px 0 0; font-size: 48px; line-height: 56px; font-weight: 700; color: var(--canvas); }
.stats .is-key dd { color: var(--primary); }
.index { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--body); }
.index a { display: grid; grid-template-columns: 48px 1fr auto; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--body); text-decoration: none; }
.index a:hover .index-name { color: var(--primary); }
.index-num { font-size: 14px; line-height: 24px; color: var(--muted); }
.index-name { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--canvas); }
.index-ko { font-size: 14px; line-height: 24px; color: var(--muted); }

/* 섹션 머리: 영문 라벨 + 헤드라인 + 한 줄 설명 */
.sec { padding: 32px 0; border-top: 1px solid var(--border); }
.sec:first-of-type { border-top: 0; }
.sec-head { max-width: 760px; margin: 32px 0; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; font-size: 14px; line-height: 21px; font-weight: 600; color: var(--primary); }
.eyebrow .eyebrow-ko { color: var(--muted); font-weight: 400; }
.sec-head h2 { margin: 0 0 16px; font-size: 30px; line-height: 45px; font-weight: 600; color: var(--fg); }
.hl { font-style: normal; color: var(--primary); }
.lead { margin: 0; font-size: 16px; line-height: 24px; color: var(--body); }

/* 핵심 발견 (확장): 주장·왜·그래서·근거·확신도·HMW */
.findings { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
.finding { display: grid; grid-template-columns: 96px 1fr; gap: 24px; padding: 24px; background: var(--surface); border-radius: 16px; }
.finding > * { min-width: 0; }
.point-num { margin: 0; font-size: 14px; line-height: 21px; font-weight: 600; color: var(--primary); }
.finding-claim { margin: 0 0 16px; font-size: 22px; line-height: 33px; font-weight: 600; color: var(--fg); }
.finding-rows { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 16px; }
.finding-rows dt { font-size: 14px; line-height: 24px; font-weight: 600; color: var(--muted); }
.finding-rows dd { margin: 0; color: var(--fg); }
.evidence { margin: 0 0 16px; padding-left: 16px; font-size: 14px; line-height: 21px; }
.evidence li { margin: 0 0 4px; }
.conf { display: inline-block; margin: 0 0 16px; padding: 4px 8px; border-radius: 6px; font-size: 14px; line-height: 21px; background: var(--canvas); color: var(--body); }
.conf b { margin: 0 8px 0 4px; color: var(--primary-hover); font-weight: 600; }
.hmw { padding: 16px; background: var(--canvas); border-radius: 10px; }
.hmw-label { display: block; margin: 0 0 4px; font-size: 14px; line-height: 21px; font-weight: 600; color: var(--primary-hover); }
.hmw-q { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--fg); }
.ideas { margin: 16px 0 0; border-top: 1px solid var(--border); }
.ideas summary { padding: 8px 0 0; cursor: pointer; font-size: 14px; line-height: 21px; color: var(--muted); }
.ideas dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 8px 0 0; font-size: 14px; line-height: 21px; }
.ideas dt { font-weight: 600; color: var(--body); }
.ideas dd { margin: 0; color: var(--body); }
.limits { margin: 0 0 24px; padding: 0; list-style: none; }
.limits li { padding: 16px 0; border-top: 1px solid var(--border); }
.limits dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 0; font-size: 14px; line-height: 21px; }
.limits dt { font-weight: 600; color: var(--muted); }
.limits dd { margin: 0; color: var(--fg); }

/* 본문 */
.prose { max-width: 760px; }
.prose h3 { margin: 32px 0 16px; font-size: 22px; line-height: 33px; font-weight: 600; color: var(--fg); }
.prose h4 { margin: 24px 0 8px; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--fg); }
.prose p { margin: 0 0 16px; }
.prose ul, .prose ol { margin: 0 0 16px; padding-left: 24px; }
.prose li { margin: 0 0 8px; }
.prose strong { color: var(--fg); font-weight: 600; }
.prose code { padding: 0 4px; background: var(--surface); border-radius: 4px; font-family: inherit; font-size: 14px; }
.table-wrap { margin: 0 0 24px; overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
.prose table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 21px; }
.prose th { padding: 8px 16px; background: var(--surface); color: var(--fg); font-weight: 600; text-align: left; white-space: nowrap; }
.prose td { padding: 8px 16px; border-top: 1px solid var(--border); vertical-align: top; min-width: 96px; }
.fig { margin: 0 0 24px; padding: 24px; border: 1px solid var(--border); border-radius: 16px; }
.fig svg { display: block; width: 100%; height: auto; }
.fig figcaption { margin: 16px 0 0; font-size: 14px; line-height: 21px; color: var(--muted); }
.insight { margin: 0 0 24px; padding: 24px; background: var(--weak-bg); border-radius: 16px; }
.insight-label { display: block; margin: 0 0 8px; font-size: 14px; line-height: 21px; font-weight: 600; color: var(--primary-hover); }
.insight p { margin: 0 0 8px; color: var(--fg); }
.insight p:last-child { margin: 0; }
.detail { margin: 0 0 24px; border: 1px solid var(--border); border-radius: 10px; }
.detail summary { padding: 16px; cursor: pointer; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--fg); }
.detail summary .chip { margin: 0 8px 0 0; padding: 4px 8px; background: var(--surface); border-radius: 6px; font-size: 14px; line-height: 21px; font-weight: 600; color: var(--body); }
.detail[open] summary { border-bottom: 1px solid var(--border); }
.detail-body { padding: 16px; }
.detail-body > :last-child { margin-bottom: 0; }
.cite { font-size: 14px; color: var(--primary-hover); text-decoration: none; white-space: nowrap; }
.cite:hover { text-decoration: underline; }
.grade { padding: 0 4px; background: var(--surface); border-radius: 4px; font-size: 14px; color: var(--body); white-space: nowrap; }

/* 출처 (확장) */
.refs { max-width: 760px; margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 21px; }
.refs li { display: grid; grid-template-columns: 32px 1fr; gap: 8px; padding: 16px 0; border-top: 1px solid var(--border); }
.refs li:target { background: var(--weak-bg); }
.ref-num { font-weight: 600; color: var(--primary-hover); }
.ref-title { color: var(--fg); }
.ref-url { display: block; margin: 4px 0 0; color: var(--muted); }
.foot { padding: 32px 0; border-top: 1px solid var(--border); font-size: 14px; line-height: 21px; color: var(--muted); }

@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  .nav-title { display: none; }
  .cover h1 { font-size: 40px; line-height: 48px; }
  .cover-grid { grid-template-columns: 1fr; gap: 24px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .finding { grid-template-columns: 1fr; gap: 8px; padding: 16px; }
  .index a { grid-template-columns: 32px 1fr; }
  .index-ko { display: none; }
  .sec-head h2 { font-size: 24px; line-height: 36px; }
  .fig { padding: 16px; }
}
</style>
</head>
<body>
<nav class="nav" aria-label="섹션 목차">
  <div class="wrap">
    <a class="nav-title" href="#top">{{short_title}}</a>
    <ul class="nav-links">{{nav}}</ul>
  </div>
</nav>
<header class="cover" id="top">
  <div class="wrap">
    <p class="cover-eyebrow">DESK RESEARCH REPORT</p>
    <h1>{{title}}</h1>
    {{answer}}
    <p class="cover-topic">{{topic}}</p>
    <div class="cover-grid">
      <div>
        <p class="cover-label">PROJECT DETAIL</p>
        <dl class="detail-list">{{detail}}</dl>
        <ul class="tags">{{tags}}</ul>
      </div>
      <dl class="stats">{{stats}}</dl>
    </div>
    <p class="cover-label">INDEX</p>
    <ol class="index">{{index}}</ol>
  </div>
</header>
<main class="wrap">
{{sections}}
</main>
<footer class="wrap foot">{{footer}}</footer>
<script>
/* 지금 읽는 섹션을 내비게이션에 표시 (애니메이션 없음) */
(function () {
  var links = {};
  document.querySelectorAll('.nav-links a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
  if (!('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting || !links[e.target.id]) return;
      Object.keys(links).forEach(function (k) { links[k].removeAttribute('aria-current'); });
      links[e.target.id].setAttribute('aria-current', 'true');
      links[e.target.id].scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
  }, { rootMargin: '-64px 0px -70% 0px' });
  document.querySelectorAll('section[id]').forEach(function (s) { io.observe(s); });
})();
</script>
</body>
</html>
